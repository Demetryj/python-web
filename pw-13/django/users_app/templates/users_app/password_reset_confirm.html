{% extends "users_app/base.html" %} {% block content %}

<h2>Enter new password</h2>
<form method="post">
  {% csrf_token %}

  <div>
    <label>New password: {{ form.new_password1 }}</label>
    <span>{{ form.errors.new_password1 }}</span>
  </div>

  <div>
    <label>New password confirmation: {{ form.new_password2 }}</label>
    <span>{{ form.errors.new_password2 }}</span>
  </div>

  <button type="submit">Save new password</button>
</form>

{% endblock %}
