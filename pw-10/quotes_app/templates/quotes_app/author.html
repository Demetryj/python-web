{% extends 'quotes_app/base.html' %} {% block content %}

<a
  href="{% url 'quotes_app:main' %}"
  style="text-decoration: none"
  class="back-link"
  >&larr; Back</a
>

<div class="author-details">
  <h3 class="author-title">{{ author_obj.fullname }}</h3>
  <p>
    <strong>Born:</strong>
    <span class="author-born-date">{{ author_obj.born_date }}</span>
    <span class="author-born-location">{{ author_obj.born_location }}</span>
  </p>
  <p><strong>Description:</strong></p>
  <div class="author-description">{{ author_obj.description }}</div>
</div>

{% endblock %}
